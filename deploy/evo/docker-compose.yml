# Optional: run the capture service on evo next to the other always-up stacks.
# Expose it through the existing cloudflared tunnel as e.g. physics.pekelman.com -> physical-web:8008
# (only /capture and /health are needed; the service refuses URLs outside PW_ALLOW and caches by url+size).
services:
  physical-web:
    build:
      context: ../..
      dockerfile: deploy/evo/Dockerfile
    container_name: physical-web
    restart: unless-stopped
    environment:
      PW_ALLOW: "https://pekelman.com/,https://www.pekelman.com/"
      PW_CACHE: /cache
      PW_BIND: 0.0.0.0
    volumes:
      - physical_web_cache:/cache
    ports:
      - "127.0.0.1:8008:8008"
    init: true
    shm_size: 1g
volumes:
  physical_web_cache:
