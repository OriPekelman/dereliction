# Optional capture service (server-assisted path). Put it behind your reverse proxy / tunnel and
# point the library at it:  Dereliction.attach({ capture: 'server', server: 'https://physics.example.com/capture' })
services:
  dereliction:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      DERELICTION_ALLOW: "https://example.com/,https://www.example.com/"   # only these URL prefixes may be captured
      DERELICTION_CACHE: /cache
      DERELICTION_BIND: 0.0.0.0
    volumes:
      - dereliction_cache:/cache
    ports:
      - "127.0.0.1:8008:8008"
    init: true
    shm_size: 1g
volumes:
  dereliction_cache:
