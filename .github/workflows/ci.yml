name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync && uv run playwright install --with-deps chromium
      - run: node --check lib/physical-web.js
      - run: (uv run server.py 8008 > server.log 2>&1 &) && sleep 6 && curl -sf http://localhost:8008/health
      - run: uv run python tests/smoke.py
      - if: failure()
        run: cat server.log
