name: pages
# Manual until the repo is public (GitHub Pages needs a public repo or a paid plan). Then add `push: {branches: [main]}`.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && cp -r index.html lib dist web _site/ && rm -rf _site/web/physics
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
